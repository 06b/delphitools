# mirrors wrangler.jsonc and public/_headers, public/_redirects
server {
	listen 80;
	root /usr/share/nginx/html;
	absolute_redirect off;

	location = /tools/gradient-generator { return 308 /tools/gradient-genny; }
	location = /tools/matte-generator { return 308 /tools/matte-genny; }
	location = /tools/scroll-generator { return 308 /tools/scroll-genny; }

	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
	}
	location /fonts/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
	}
	location ~ ^/(compress|jxl|mupdf|mediainfo)/ {
		add_header Cache-Control "public, max-age=86400";
	}

	location / {
		try_files $uri $uri/index.html /index.html;
	}
}
